# CodeVision Python package configuration.
# Project layout:
#   src/codevision/   -> Python package
#   tests/            -> test suite
#   resources/        -> application resources
#   reports/          -> generated reports
#   docs/             -> documentation

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "codevision"
version = "0.1.0"
description = "CodeVision - C/C++ analysis and visualization tool"
license = { file = "LICENSE" }

requires-python = ">=3.10"

dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-c>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
    "networkx>=3.0.0",
    "graphviz>=0.20.0",
    "reportlab>=4.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]


[project.scripts]
codevision = "codevision.main:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["codevision*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


# Include application resources if they are later moved inside
# the codevision package.
[tool.setuptools.package-data]
codevision = [
    "*.css",
    "*.png",
    "*.svg",
    "*.ui",
]